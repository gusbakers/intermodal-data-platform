name: Logistics pipeline checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check code and notebook structure
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python scripts/verify_project.py
      - name: Run behavioral tests
        run: python -m pytest -m 'not integration' --cov=src --cov-report=term-missing
      - name: Rebuild outputs and execute notebooks
        run: |
          python run_full_pipeline.py
          python scripts/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: logistics-outputs-python-${{ matrix.python-version }}
          path: outputs/

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: intermodal_test
          POSTGRES_USER: data_engineer
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U data_engineer -d intermodal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://data_engineer:disposable-ci-password@127.0.0.1:5432/intermodal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test repeat loads, SQL/Python parity and rollback
        run: python -m pytest -m integration
      - name: Load the complete dataset twice
        env:
          DATABASE_URL: postgresql://data_engineer:disposable-ci-password@127.0.0.1:5432/intermodal_test
        run: |
          python run_full_pipeline.py --with-database --no-charts
          python run_full_pipeline.py --with-database --no-charts
          python -c "import json; s=json.load(open('outputs/run_summary.json')); assert s['database']['stored_shipments']==20000; assert s['database']['changed_records']==0"
